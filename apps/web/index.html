<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>Matthew Sullivan | Software Engineer</title>
    <meta name="description" content="Full-stack developer at EHMA.ai, where I build wAve. I also make Sprout AAC, a free, open-source communication app for kids." />
    <link rel="canonical" href="https://matthewsullivan.dev/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e0b18" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Brand fonts (self-hosted); preloaded so the hero doesn't swap fonts visibly -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Apply a saved light theme before first paint (its sha256 is allowed in public/_headers) -->
    <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://matthewsullivan.dev/#person",
            "name": "Matthew Sullivan",
            "url": "https://matthewsullivan.dev/",
            "image": "https://matthewsullivan.dev/avatar.jpg",
            "jobTitle": "Full-Stack Developer",
            "description": "Full-stack developer at EHMA.ai and creator of Sprout AAC, a free, open-source communication app for kids.",
            "worksFor": { "@type": "Organization", "name": "EHMA.ai", "url": "https://landing.ehma.ai/" },
            "alumniOf": { "@type": "CollegeOrUniversity", "name": "Arizona State University" },
            "knowsAbout": ["React", "TypeScript", "Python", ".NET", "Microsoft Azure", "Cloudflare Workers", "Flutter", "Swift", "Accessibility", "Augmentative and alternative communication"],
            "sameAs": [
              "https://www.linkedin.com/in/mlsulli",
              "https://github.com/fr0ggy-p3ngu1n"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://matthewsullivan.dev/#website",
            "url": "https://matthewsullivan.dev/",
            "name": "Matthew Sullivan",
            "author": { "@id": "https://matthewsullivan.dev/#person" }
          }
        ]
      }
    </script>

    <!-- WebKit scrollbar (inline to bypass Tailwind CSS optimizer which strips ::-webkit- prefix) -->
    <style>
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-surface, #151122); }
      ::-webkit-scrollbar-thumb { background: var(--bd-primary, #2a2340); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--tx-accent, #ec4899); }
    </style>

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://matthewsullivan.dev/" />
    <meta property="og:site_name"   content="Matthew Sullivan" />
    <meta property="og:title"       content="Matthew Sullivan — Full-Stack Software Engineer" />
    <meta property="og:description" content="Full-stack developer at EHMA.ai, where I build wAve. I also make Sprout AAC, a free, open-source communication app for kids." />
    <meta property="og:image"       content="https://matthewsullivan.dev/og-image.png?v=3" />
    <meta property="og:image:alt"   content="Matthew Sullivan, Full-Stack Developer: the MS signal logo on a dark background" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type"   content="image/png" />
    <!-- Bump ?v= on og-image.png when the image changes: LinkedIn caches preview images by URL -->
    <!-- LinkedIn reads these for its author and publish-date fields; the date is the site's launch (first commit) -->
    <meta name="author" content="Matthew Sullivan" />
    <meta name="publish_date" property="og:publish_date" content="2026-02-24T15:01:15Z" />
    <meta property="article:published_time" content="2026-02-24T15:01:15Z" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Matthew Sullivan — Full-Stack Software Engineer" />
    <meta name="twitter:description" content="Full-stack developer at EHMA.ai, where I build wAve. I also make Sprout AAC, a free, open-source communication app for kids." />
    <meta name="twitter:image"       content="https://matthewsullivan.dev/og-image.png?v=3" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "17b563c344ab4adc9c307833c5792dec"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
