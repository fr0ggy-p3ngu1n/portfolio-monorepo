name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Served at api.matthewsullivan.dev; wrangler creates the DNS record on deploy.
routes = [{ pattern = "api.matthewsullivan.dev", custom_domain = true }]
workers_dev = false

# Bundle .wasm files as pre-compiled WebAssembly modules.
# Cloudflare Workers disallows runtime WASM compilation (WebAssembly.compile /
# WebAssembly.instantiate with raw bytes), so all WASM must be bundled at build
# time. Wrangler then provides each import as a WebAssembly.Module at runtime.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "4a2d2335-ca4f-49d7-88a4-ec575d101d14"
migrations_dir = "migrations"

# Per-IP throttles for the public POST endpoints (namespace ids are
# account-wide; redacted-records uses 1001/1002)
[[ratelimits]]
name = "CONTACT_LIMIT"
namespace_id = "2001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "LEADERBOARD_LIMIT"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "portfolio-assets"
